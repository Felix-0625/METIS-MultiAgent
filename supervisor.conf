[program:fastapi]
; FastAPI 后端使用 startup.sh 启动，确保数据初始化完成
command=sh startup.sh
directory=/app
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
; 启动延迟，确保有足够时间初始化
startsecs=10
; 重启策略：失败时重启，但最多重试3次
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30

[program:nginx]
; Nginx 运行在前台；监听端口由容器启动时从 PORT 渲染
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Nginx 依赖后端，延迟启动
priority=999
